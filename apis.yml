name: Vium
description: >-
  Vium was a preclinical biotechnology company that operated a "digital
  vivarium" — a cloud-connected laboratory platform that continuously monitored
  laboratory animals with sensors and computer vision to generate high-resolution
  physiological and behavioral data for pharmaceutical drug discovery and
  toxicology studies. Backed by DCVC and Lux Capital, Vium was acquired by
  Recursion Pharmaceuticals in 2021 and no longer operates as an independent
  company. Its former primary domain (vium.com) is now parked and listed for
  sale, and it publishes no live developer portal, documentation, or API surface
  to enrich.
